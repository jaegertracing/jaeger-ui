#
# Jaeger configuration for generating the v3 trace contract fixture.
#
# This exists so the storage backend behind the fixture is declared rather than
# inherited: running the image with no --config uses a default compiled into the
# binary, which answers "which storage was used" only as "whatever that build
# happened to choose". Naming memory storage here makes the answer explicit and
# survives a change to that default.
#
# Only the OTLP HTTP path the capture actually uses is configured. The upstream
# all-in-one config additionally wires the Jaeger and Zipkin receivers, remote
# sampling, health, expvar and zpages; none of them sit between the submitted
# payload and the query response, and a capture taken with this config is
# byte-for-byte identical to one taken with the image default.

service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: warn
    metrics:
      level: none

extensions:
  jaeger_query:
    storage:
      traces: fixture_storage
    http:
      endpoint: 0.0.0.0:16686
    grpc:
      endpoint: 0.0.0.0:16685

  jaeger_storage:
    backends:
      fixture_storage:
        memory:
          max_traces: 100000

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: fixture_storage

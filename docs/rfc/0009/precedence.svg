<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:780px;height:564px;background:#FFFFFF;" width="780px" height="564px" viewBox="0 0 780 564" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="13" y="13" width="749.864" height="16.641" fill="#FFC" style="stroke:#FD8;stroke-width:3;" rx="2.5" ry="2.5"/><text x="20" y="23.641" fill="#000" font-size="10" textLength="535.825" font-family="monospace">This syntax is deprecated, you must add &lt;&lt;#fff3bf>> at the end of the line, after the ';'</text><ellipse cx="303.862" cy="46.641" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="201.191,76.641,406.533,76.641,418.533,88.641,406.533,100.641,201.191,100.641,189.191,88.641,201.191,76.641" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="201.191" y="92.449" fill="#000" font-size="11" textLength="205.342" font-family="Helvetica">URL carries a service set in svcFilter?</text><text x="170.183" y="86.046" fill="#000" font-size="11" textLength="19.008" font-family="Helvetica">yes</text><text x="418.533" y="86.046" fill="#000" font-size="11" textLength="13.702" font-family="Helvetica">no</text><rect x="16" y="110.641" width="267.699" height="47.938" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="131.779" fill="#000" font-size="12" textLength="96.258" font-family="Helvetica">Service hide set</text><text x="26" y="145.748" fill="#000" font-size="12" textLength="247.699" font-family="Helvetica">from svcFilter (a stale one hides nothing)</text><rect x="303.699" y="110.641" width="308.352" height="75.875" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="313.699" y="131.779" fill="#000" font-size="12" textLength="129.908" font-family="Helvetica">Saved service default</text><text x="313.699" y="145.748" fill="#000" font-size="12" textLength="284.279" font-family="Helvetica">(localStorage, written only by Save as Default),</text><text x="313.699" y="159.717" fill="#000" font-size="12" textLength="268.336" font-family="Helvetica">unless it would leave no span, and not again</text><text x="313.699" y="173.686" fill="#000" font-size="12" textLength="288.352" font-family="Helvetica">for the same URL after an edit or a URL cleanup</text><polygon points="303.862,192.516,315.862,204.516,303.862,216.516,291.862,204.516,303.862,192.516" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="218.935,236.516,388.79,236.516,400.79,248.516,388.79,260.516,218.935,260.516,206.935,248.516,218.935,236.516" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="218.935" y="252.324" fill="#000" font-size="11" textLength="169.855" font-family="Helvetica">URL carries svcFilter, f or tree?</text><text x="187.926" y="245.921" fill="#000" font-size="11" textLength="19.008" font-family="Helvetica">yes</text><text x="400.79" y="245.921" fill="#000" font-size="11" textLength="13.702" font-family="Helvetica">no</text><rect x="72.779" y="270.516" width="195.119" height="47.938" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="82.779" y="291.654" fill="#000" font-size="12" textLength="175.119" font-family="Helvetica">Other clauses and tree mode</text><text x="82.779" y="305.623" fill="#000" font-size="12" textLength="168.779" font-family="Helvetica">from f=… and tree=remove</text><rect x="287.898" y="270.516" width="298.977" height="75.875" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="297.898" y="291.654" fill="#000" font-size="12" textLength="74.777" font-family="Helvetica">View default</text><text x="297.898" y="305.623" fill="#000" font-size="12" textLength="274.207" font-family="Helvetica">(Timeline: none. GenAI view of a GenAI trace:</text><text x="297.898" y="319.592" fill="#000" font-size="12" textLength="243.738" font-family="Helvetica">hide Non-GenAI, lift children, unless that</text><text x="297.898" y="333.561" fill="#000" font-size="12" textLength="278.977" font-family="Helvetica">would leave no span with the services hidden)</text><polygon points="303.862,352.391,315.862,364.391,303.862,376.391,291.862,364.391,303.862,352.391" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="175.679" y="396.391" width="256.367" height="33.969" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="185.679" y="417.529" fill="#000" font-size="12" textLength="236.367" font-family="Helvetica">uiFind text, from the URL in either case</text><path d="M395.614,446.629 L395.614,470.328 L375.614,474.328 L395.614,478.328 L395.614,502.027 A0,0 0 0 0 395.614,502.027 L759.864,502.027 A0,0 0 0 0 759.864,502.027 L759.864,456.629 L749.864,446.629 L395.614,446.629 A0,0 0 0 0 395.614,446.629" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M749.864,446.629 L749.864,456.629 L759.864,456.629 L749.864,446.629" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="401.614" y="463.696" fill="#000" font-size="13" textLength="276.218" font-family="Helvetica">Clearing the filter in the GenAI view writes</text><text x="401.614" y="478.829" fill="#000" font-size="13" textLength="312.305" font-family="Helvetica">an explicitly empty clause list to the URL, which</text><text x="401.614" y="493.961" fill="#000" font-size="13" textLength="343.25" font-family="Helvetica">later edits keep, so the view default does not return.</text><rect x="232.11" y="450.359" width="143.504" height="47.938" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="242.11" y="471.498" fill="#000" font-size="12" textLength="101.127" font-family="Helvetica">Effective clauses</text><text x="242.11" y="485.467" fill="#000" font-size="12" textLength="123.504" font-family="Helvetica">→ findIDs, hiddenIDs</text><ellipse cx="303.862" cy="533.027" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="303.862" cy="533.027" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="189.191" y1="88.641" x2="149.85" y2="88.641" style="stroke:#1E1E1E;stroke-width:1;"/><line x1="149.85" y1="88.641" x2="149.85" y2="110.641" style="stroke:#1E1E1E;stroke-width:1;"/><polygon points="145.85,100.641,149.85,110.641,153.85,100.641,149.85,104.641" fill="#1E1E1E" style="stroke:#1E1E1E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="418.533" y1="88.641" x2="457.875" y2="88.641" style="stroke:#1E1E1E;stroke-width:1;"/><line x1="457.875" y1="88.641" x2="457.875" y2="110.641" style="stroke:#1E1E1E;stroke-width:1;"/><polygon points="453.875,100.641,457.875,110.641,461.875,100.641,457.875,104.641" fill="#1E1E1E" style="stroke:#1E1E1E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="149.85" y1="158.578" x2="149.85" y2="204.516" style="stroke:#1E1E1E;stroke-width:1;"/><line x1="149.85" y1="204.516" x2="291.862" y2="204.516" style="stroke:#1E1E1E;stroke-width:1;"/><polygon points="281.862,200.516,291.862,204.516,281.862,208.516,285.862,204.516" fill="#1E1E1E" style="stroke:#1E1E1E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="457.875" y1="186.516" x2="457.875" y2="204.516" style="stroke:#1E1E1E;stroke-width:1;"/><line x1="457.875" y1="204.516" x2="315.862" y2="204.516" style="stroke:#1E1E1E;stroke-width:1;"/><polygon points="325.862,200.516,315.862,204.516,325.862,208.516,321.862,204.516" fill="#1E1E1E" style="stroke:#1E1E1E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="303.862" y1="56.641" x2="303.862" y2="76.641" style="stroke:#1E1E1E;stroke-width:1;"/><polygon points="299.862,6
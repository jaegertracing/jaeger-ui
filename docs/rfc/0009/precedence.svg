<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="528px" preserveAspectRatio="none" style="width:766px;height:528px;background:#FFFFFF;" version="1.1" viewBox="0 0 766 528" width="766px" zoomAndPan="magnify"><defs/><g><ellipse cx="298.8623" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><polygon fill="#FFFFFF" points="196.1912,50,401.5334,50,413.5334,62,401.5334,74,196.1912,74,184.1912,62,196.1912,50" style="stroke:#1E1E1E;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="205.3423" x="196.1912" y="65.8081">URL carries a service set in svcFilter?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="165.1829" y="59.4058">yes</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="413.5334" y="59.4058">no</text><rect fill="#FFF3BF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#1E1E1E;stroke-width:0.5;" width="267.6992" x="11" y="84"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="96.2578" x="21" y="105.1387">Service hide set</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="247.6992" x="21" y="119.1074">from svcFilter (a stale one hides nothing)</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#1E1E1E;stroke-width:0.5;" width="308.3516" x="298.6992" y="84"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="129.9082" x="308.6992" y="105.1387">Saved service default</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="284.2793" x="308.6992" y="119.1074">(localStorage, written only by Save as Default),</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="268.3359" x="308.6992" y="133.0762">unless it would leave no span, and not again</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="288.3516" x="308.6992" y="147.0449">for the same URL after an edit or a URL cleanup</text><polygon fill="#FFFFFF" points="298.8623,165.875,310.8623,177.875,298.8623,189.875,286.8623,177.875,298.8623,165.875" style="stroke:#1E1E1E;stroke-width:0.5;"/><polygon fill="#FFFFFF" points="213.9346,209.875,383.79,209.875,395.79,221.875,383.79,233.875,213.9346,233.875,201.9346,221.875,213.9346,209.875" style="stroke:#1E1E1E;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="169.8555" x="213.9346" y="225.6831">URL carries svcFilter, f or tree?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="182.9263" y="219.2808">yes</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="395.79" y="219.2808">no</text><rect fill="#FFF3BF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#1E1E1E;stroke-width:0.5;" width="195.1191" x="67.7788" y="243.875"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="175.1191" x="77.7788" y="265.0137">Other clauses and tree mode</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="138.5449" x="77.7788" y="278.9824">from f=&#8230; and tree=lift</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#1E1E1E;stroke-width:0.5;" width="298.9766" x="282.8979" y="243.875"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="74.7773" x="292.8979" y="265.0137">View default</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="274.207" x="292.8979" y="278.9824">(Timeline: none. GenAI view of a GenAI trace:</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="243.7383" x="292.8979" y="292.9512">hide Non-GenAI, lift children, unless that</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="278.9766" x="292.8979" y="306.9199">would leave no span with the services hidden)</text><polygon fill="#FFFFFF" points="298.8623,325.75,310.8623,337.75,298.8623,349.75,286.8623,337.75,298.8623,325.75" style="stroke:#1E1E1E;stroke-width:0.5;"/><rect fill="#FFFFFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#1E1E1E;stroke-width:0.5;" width="256.3672" x="170.6787" y="369.75"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="236.3672" x="180.6787" y="390.8887">uiFind text, from the URL in either case</text><path d="M390.6143,419.9883 L390.6143,443.6875 L370.6143,447.6875 L390.6143,451.6875 L390.6143,475.3867 A0,0 0 0 0 390.6143,475.3867 L754.8638,475.3867 A0,0 0 0 0 754.8638,475.3867 L754.8638,429.9883 L744.8638,419.9883 L390.6143,419.9883 A0,0 0 0 0 390.6143,419.9883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M744.8638,419.9883 L744.8638,429.9883 L754.8638,429.9883 L744.8638,419.9883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="276.2183" x="396.6143" y="437.0552">Clearing the filter in the GenAI view writes</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="312.3047" x="396.6143" y="452.188">an explicitly empty clause list to the URL, which</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="343.2495" x="396.6143" y="467.3208">later edits keep, so the view default does not return.</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#1E1E1E;stroke-width:0.5;" width="143.5039" x="227.1104" y="423.7188"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="101.127" x="237.1104" y="444.8574">Effective clauses</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="123.5039" x="237.1104" y="458.8262">&#8594; findIDs, hiddenIDs</text><ellipse cx="298.8623" cy="506.3867" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="298.8623" cy="506.3867" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#1E1E1E;stroke-width:1;" x1="184.1912" x2="144.8496" y1="62" y2="62"/><line style="stroke:#1E1E1E;stroke-width:1;" x1="144.8496" x2="144.8496" y1="62" y2="84"/><polygon fill="#1E1E1E" points="140.8496,74,144.8496,84,148.8496,74,144.8496,78" style="stroke:#1E1E1E;stroke-width:1;"/><line style="stroke:#1E1E1E;stroke-width:1;" x1="413.5334" x2="452.875" y1="62" y2="62"/><line style="stroke:#1E1E1E;stroke-width:1;" x1="452.875" x2="452.875" y1="62" y2="84"/><polygon fill="#1E1E1E" points="448.875,74,452.875,84,456.875,74,452.875,78" style="stroke:#1E1E1E;stroke-width:1;"/><line style="stroke:#1E1E1E;stroke-width:1;" x1="144.8496" x2="144.8496" y1="131.9375" y2="177.875"/><line style="stroke:#1E1E1E;stroke-width:1;" x1="144.8496" x2="286.8623" y1="177.875" y2="177.875"/><polygon fill="#1E1E1E" points="276.8623,173.875,286.8623,177.875,276.8623,181.875,280.8623,177.875" style="stroke:#1E1E1E;stroke-width:1;"/><line style="stroke:#1E1E1E;stroke-width:1;" x1="452.875" x2="452.875" y1="159.875" y2="177.875"/><line style="stroke:#1E1E1E;stroke-width:1;" x1="452.875" x2="310.8623" y1="177.875" y2="177.875"/><polygon fill="#1E1E1E" points="320.8623,173.875,310.8623,177.875,320.8623,181.875,316.8623,177.875" style="stroke:#1E1E1E;stroke-width:1;"/><line style="stroke:#1E1E1E;stroke-width:1;" x1="298.8623" x2="298.8623" y1="30" y2="50"/><polygon fill="#1E1E1E" points
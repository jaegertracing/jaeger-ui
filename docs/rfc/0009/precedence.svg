<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:770px;height:500px;background:#FFFFFF;" width="770px" height="500px" viewBox="0 0 770 500" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="13" y="13" width="739.708" height="16.641" fill="#FFC" style="stroke:#FD8;stroke-width:3;" rx="2.5" ry="2.5"/><text x="20" y="23.641" fill="#000" font-size="10" textLength="535.825" font-family="monospace">This syntax is deprecated, you must add &lt;&lt;#fff3bf>> at the end of the line, after the ';'</text><ellipse cx="327.445" cy="46.641" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="232.28,76.641,422.61,76.641,434.61,88.641,422.61,100.641,232.28,100.641,220.28,88.641,232.28,76.641" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="232.28" y="92.449" fill="#000" font-size="11" textLength="190.33" font-family="Helvetica">URL carries f or a legacy svcFilter?</text><text x="201.271" y="86.046" fill="#000" font-size="11" textLength="19.008" font-family="Helvetica">yes</text><text x="434.61" y="86.046" fill="#000" font-size="11" textLength="13.702" font-family="Helvetica">no</text><rect x="16" y="110.641" width="300.5" height="75.875" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="131.779" fill="#000" font-size="12" textLength="108.656" font-family="Helvetica">Clauses from f=…</text><text x="26" y="145.748" fill="#000" font-size="12" textLength="241.822" font-family="Helvetica">(a legacy svcFilter is read as the service</text><text x="26" y="159.717" fill="#000" font-size="12" textLength="280.5" font-family="Helvetica">hide clause in remove mode, a stale one hides</text><text x="26" y="173.686" fill="#000" font-size="12" textLength="251.355" font-family="Helvetica">nothing, and the URL is rewritten as f=…)</text><rect x="336.5" y="110.641" width="304.279" height="117.781" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="346.5" y="131.779" fill="#000" font-size="12" textLength="74.777" font-family="Helvetica">View default</text><text x="346.5" y="145.748" fill="#000" font-size="12" textLength="274.207" font-family="Helvetica">(Timeline: none. GenAI view of a GenAI trace:</text><text x="346.5" y="159.717" fill="#000" font-size="12" textLength="243.738" font-family="Helvetica">hide Non-GenAI, lift children, unless that</text><text x="346.5" y="173.686" fill="#000" font-size="12" textLength="278.977" font-family="Helvetica">would leave no span with the services hidden)</text><text x="346.5" y="187.654" fill="#000" font-size="12" textLength="180.674" font-family="Helvetica">plus the saved service default</text><text x="346.5" y="201.623" fill="#000" font-size="12" textLength="284.279" font-family="Helvetica">(localStorage, written only by Save as Default),</text><text x="346.5" y="215.592" fill="#000" font-size="12" textLength="177.586" font-family="Helvetica">unless it would leave no span</text><polygon points="327.445,234.422,339.445,246.422,327.445,258.422,315.445,246.422,327.445,234.422" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="201.256" y="278.422" width="252.377" height="33.969" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="211.256" y="299.561" fill="#000" font-size="12" textLength="232.377" font-family="Helvetica">Tree mode from tree=remove, else lift</text><rect x="199.261" y="332.391" width="256.367" height="33.969" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="209.261" y="353.529" fill="#000" font-size="12" textLength="236.367" font-family="Helvetica">uiFind text, from the URL in either case</text><path d="M419.197,382.629 L419.197,406.328 L399.197,410.328 L419.197,414.328 L419.197,438.027 A0,0 0 0 0 419.197,438.027 L749.708,438.027 A0,0 0 0 0 749.708,438.027 L749.708,392.629 L739.708,382.629 L419.197,382.629 A0,0 0 0 0 419.197,382.629" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M739.708,382.629 L739.708,392.629 L749.708,392.629 L739.708,382.629" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="425.197" y="399.696" fill="#000" font-size="13" textLength="309.512" font-family="Helvetica">Every edit writes the clauses as f=…, an empty</text><text x="425.197" y="414.829" fill="#000" font-size="13" textLength="290.386" font-family="Helvetica">list as an explicitly empty f=, so that neither</text><text x="425.197" y="429.961" fill="#000" font-size="13" textLength="227.303" font-family="Helvetica">default returns on the next render.</text><rect x="255.693" y="386.359" width="143.504" height="47.938" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="265.693" y="407.498" fill="#000" font-size="12" textLength="101.127" font-family="Helvetica">Effective clauses</text><text x="265.693" y="421.467" fill="#000" font-size="12" textLength="123.504" font-family="Helvetica">→ findIDs, hiddenIDs</text><ellipse cx="327.445" cy="469.027" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="327.445" cy="469.027" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="220.28" y1="88.641" x2="166.25" y2="88.641" style="stroke:#1E1E1E;stroke-width:1;"/><line x1="166.25" y1="88.641" x2="166.25" y2="110.641" style="stroke:#1E1E1E;stroke-width:1;"/><polygon points="162.25,100.641,166.25,110.641,170.25,100.641,166.25,104.641" fill="#1E1E1E" style="stroke:#1E1E1E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="434.61" y1="88.641" x2="488.64" y2="88.641" style="stroke:#1E1E1E;stroke-width:1;"/><line x1="488.64" y1="88.641" x2="488.64" y2="110.641" style="stroke:#1E1E1E;stroke-width:1;"/><polygo
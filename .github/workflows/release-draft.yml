# Drafts the GitHub release as soon as the "Prepare release vX.Y.Z" PR
# (opened by `make prepare-release`) lands on main.
name: Draft release

on:
  push:
    branches:
      - main

# Scorecard Token-Permissions: read-only default; writes stay on the draft job.
permissions:
  contents: read

jobs:
  draft-release:
    if: |
      github.repository == 'jaegertracing/jaeger-ui' &&
      startsWith(github.event.head_commit.message, 'Prepare release v')
    permissions:
      # Required to create the draft release.
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make draft-release TARGET="${GITHUB_SHA}"

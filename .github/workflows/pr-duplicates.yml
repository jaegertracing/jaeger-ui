name: Duplicate PRs

on:
  pull_request_target:
    types:
      [
        opened,
        edited,
        closed,
        reopened,
        synchronize,
        ready_for_review,
        converted_to_draft,
        labeled,
        unlabeled,
      ]
  issues:
    types: [labeled, unlabeled]
  schedule:
    # The nightly run covers the changes that fire no event here: a pull request
    # unlinked from its issue in the sidebar, and the stale label, which
    # GITHUB_TOKEN sets.
    - cron: '45 2 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Log intended changes without writing labels or comments'
        required: false
        type: boolean
        default: false
      pullRequestNumber:
        description: 'Pull request whose event asked for this run; narrows the comment lookups'
        required: false
        type: string
        default: ''
      issueNumber:
        description: 'Issue whose label event asked for this run; narrows the comment lookups'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  # The label-duplicate-prs job runs under a repository-wide concurrency group,
  # and GitHub cancels a queued job of a group when a newer one arrives. This job
  # keeps that cancellation off the pull request: it only dispatches the workflow,
  # so the cancelled run belongs to the default branch, and the pull request's
  # check reports only whether the dispatch succeeded.
  dispatch-duplicate-labelling:
    # On an issue, only the allow-multiple-prs label changes the outcome.
    if: >-
      github.event_name == 'pull_request_target' || (github.event_name == 'issues' && github.event.label.name == 'allow-multiple-prs')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the duplicate labelling
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          gh workflow run pr-duplicates.yml --ref "$DEFAULT_BRANCH" -f pullRequestNumber="$PR_NUMBER" -f issueNumber="$ISSUE_NUMBER"

  label-duplicate-prs:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    # A skipped job does not acquire this job-level concurrency group, so the runs
    # that only dispatch do not cancel a queued run.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Label duplicate pull requests
        # The action is shared with jaegertracing/jaeger. The pin means that a
        # change there reaches this repository only when a reviewed pull request
        # bumps the SHA.
        uses: jaegertracing/jaeger/.github/actions/pr-duplicates@5c3eea742bd0e8b73b18421f2822caace1e240ff
        with:
          token: ${{ github.token }}
          pull-request-number: ${{ inputs.pullRequestNumber }}
          issue-number: ${{ inputs.issueNumber }}
          dry-run: ${{ inputs.dryRun || 'false' }}
